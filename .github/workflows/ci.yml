name: MoonSMB CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: |
          moon version --all
          moonc -v
      - name: Check
        run: moon check --deny-warn
      - name: Build native
        run: moon build --target native --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Run examples
        run: |
          moon run examples/negotiate
          moon run examples/file-read
          moon run examples/diagnostic
      - name: Generate interfaces
        run: moon info
      - name: Check formatting
        run: moon fmt --check
